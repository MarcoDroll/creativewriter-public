name: Feature Request
description: Suggest a new feature or improvement for CreativeWriter
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see in CreativeWriter.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem does this feature solve? Is this related to a frustration you experience?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I tried ... but it doesn't fully solve the problem because ...

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which area of the application does this relate to?
      options:
        - Editor
        - AI Generation
        - Codex
        - Media
        - Sync
        - Mobile
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples for the feature request.
