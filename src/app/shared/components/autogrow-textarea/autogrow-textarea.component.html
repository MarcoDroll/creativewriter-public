<div class="grow-wrap" [attr.data-replicated-value]="mirrorValue">
  <textarea
    [value]="displayValue"
    [placeholder]="placeholder"
    [style.min-height]="minHeight"
    [style.max-height]="maxHeight"
    [disabled]="disabled"
    [readonly]="readonly"
    [attr.aria-label]="ariaLabel"
    [attr.aria-labelledby]="ariaLabelledBy"
    (input)="onInput($event)">
  </textarea>
</div>
